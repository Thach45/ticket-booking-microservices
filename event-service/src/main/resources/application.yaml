server:
  port: 8082 # Service này chạy cổng 8082, không được trùng cổng

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5433/event_db # Trỏ vào port 5433 của docker-compose
    username: root
    password: rootpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672 # Cổng này giao tiếp với code
    username: guest
    password: guest