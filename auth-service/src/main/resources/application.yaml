server:
  port: 8081 # Service này chạy cổng 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: root
    password: rootpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo bảng từ Code Entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true