server:
  port: 8083 # Service này chạy cổng 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5434/booking_db
    username: root
    password: rootpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo bảng từ Code Entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672 # Cổng này giao tiếp với code
    username: guest
    password: guest
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true